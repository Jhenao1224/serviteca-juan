<div class="pricing-header p-3 pb-md-4 mx-auto text-center">
  <h1>Crear Cliente</h1>
  <div class="bg-body-tertiary p-3 rounded">
    <form class="row" #f="ngForm" (ngSubmit)="f.form.valid && guardarCliente()">
      <label for="cedula" class="form-label">Cédula</label>
      <input class="form-control"
        type="number" name="cedula" id="cedula" placeholder="Cédula"
        [(ngModel)]="cedula"
      /><br>

      <label for="nombres" class="form-label">Nombres</label>
      <input class="form-control"
        type="text" name="nombres" id="nombres" placeholder="Nombres"
        [(ngModel)]="nombres"
      /><br>

      <label for="apellidos" class="form-label">Apellidos</label>
      <input class="form-control"
        type="text" name="apellidos" id="apellidos" placeholder="Apellidos"
        [(ngModel)]="apellidos"
      /><br>

      <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
      <input class="form-control"
        type="date" name="fechaNacimiento" id="fechaNacimiento" required
        [(ngModel)]="fechaNacimiento"
      /><br>

      <!-- Mensaje visual -->
      <div *ngIf="mensaje" [ngClass]="{'text-success': mensajeTipo === 'success', 'text-danger': mensajeTipo === 'error'}" class="my-2">
        {{ mensaje }}
      </div>

      <button class="btn btn-outline-secondary" type="submit" style="cursor: pointer">Crear cliente</button>
    </form>
  </div>
</div>
<router-outlet></router-outlet>
