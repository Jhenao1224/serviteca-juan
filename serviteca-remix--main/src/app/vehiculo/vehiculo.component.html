<div class="pricing-header p-3 pb-md-4 mx-auto text-center">
  <h1>Crear Vehiculo</h1>
  <div class="bg-body-tertiary p-3 rounded">

    <!-- 🔔 Mensaje HTML -->
    <div *ngIf="mensaje" [ngClass]="mensajeTipo === 'error' ? 'alert alert-danger' : 'alert alert-success'" role="alert" id="mensajeAlerta">
      {{ mensaje }}
    </div>

    <form class="row" #f="ngForm" (ngSubmit)="f.form.valid && guardarVehiculos()">
      <label for="placa" class="form-label">Placa</label>
      <input class="form-control" type="text" name="placa" id="placa" placeholder="placa" [(ngModel)]="placa" /><br>

      <label for="cliente" class="form-label">Cliente</label>
      <select class="form-select" id="cliente">
        <option value="{{clienteItem.cedula}}" *ngFor="let clienteItem of clientes">{{ clienteItem.cedula }} - {{ clienteItem.nombres }}</option>
      </select><br>

      <label for="modelo" class="form-label">Modelo Vehiculo</label>
      <input class="form-control" type="number" name="modelo" id="modelo" placeholder="modelo" [(ngModel)]="modelo" /><br>

      <label for="tipo" class="form-label">Tipo vehiculo</label>
      <select class="form-select" id="tipo">
        <option value="Sedan">Sedan</option>
        <option value="Campero">Campero</option>
      </select><br>

      <button class="btn btn-outline-secondary" type="submit">Crear vehiculo</button>
    </form>
  </div>
</div>

<router-outlet></router-outlet>
